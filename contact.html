<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio - Contact</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 导航栏 -->
    <div class="navbar">
        <div class="navbar-container">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="projects.html">Projects</a>
            <a href="contact.html">Contact</a>
        </div>
    </div>

    <!-- 联系页内容 -->
    <div class="content-container">
        <h1>Get In Touch</h1>
        <p>Have a project idea or want to discuss potential collaboration? Fill out the form below and I'll respond as soon as possible.</p>

        <form action="#" method="POST">
            <div class="form-group">
                <label for="name">Your Name</label>
                <input type="text" id="name" name="username" required>
            </div>

            <div class="form-group">
                <label for="email">Your Email</label>
                <input type="email" id="email" name="useremail" required>
            </div>

            <div class="form-group">
                <label>Contact Purpose</label>
                <div class="radio-group">
                    <div class="radio-item">
                        <input type="radio" id="purpose1" name="purpose" value="project" required>
                        <label for="purpose1">Project Collaboration</label>
                    </div>
                    <div class="radio-item">
                        <input type="radio" id="purpose2" name="purpose" value="question">
                        <label for="purpose2">Technical Question</label>
                    </div>
                    <div class="radio-item">
                        <input type="radio" id="purpose3" name="purpose" value="other">
                        <label for="purpose3">Other Inquiry</label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>Areas of Interest</label>
                <div class="checkbox-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="area1" name="area" value="web">
                        <label for="area1">Web Development</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="area2" name="area" value="ai">
                        <label for="area2">Artificial Intelligence</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="area3" name="area" value="finance">
                        <label for="area3">Financial Technology</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="area4" name="area" value="math">
                        <label for="area4">Mathematical Modeling</label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="message">Your Message</label>
                <textarea id="message" name="message" rows="5" required></textarea>
            </div>

            <button type="submit">Send Message</button>
            <button type="reset">Reset</button>
        </form>
    </div>

    <footer>
        <p>&copy; 2025 My Portfolio. All rights reserved.</p>
    </footer>
    <script src="js/main.js"></script>
</body>
</html>
